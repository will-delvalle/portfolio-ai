<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Project Portfolio | Will Del Valle</title>
<meta name="description" content="AI data and model-evaluation projects led and delivered by Will Del Valle at Scale AI and Pareto AI.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%230055B3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-color:#FAFAFA;--surface-color:#FFFFFF;--text-primary:#111111;--text-secondary:#6B7280;
  --accent-color:#0055B3;--accent-light:rgba(0,85,179,0.08);--border-color:rgba(0,0,0,0.06);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.02);
  --shadow-md:0 10px 25px rgba(0,0,0,0.06),0 4px 10px rgba(0,0,0,0.04);
  --shadow-lg:0 20px 50px rgba(0,0,0,0.10);
  --transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
  --radius-md:20px;--radius-lg:28px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-color);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:1200px;margin:0 auto;padding:0 2rem}

.intro{padding:9rem 0 3rem}
.eyebrow{font-size:0.78rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-color);margin-bottom:1rem}
h1{font-size:3.5rem;line-height:1.08;letter-spacing:-0.03em;max-width:16ch}
.lead{margin-top:1.25rem;font-size:1.15rem;color:var(--text-secondary);max-width:74ch;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:3rem;border-top:1px solid var(--border-color);padding-top:2rem}
.stats h4{font-size:2.25rem;font-weight:600;letter-spacing:-0.02em;color:#D97706}
.stats p{color:var(--text-secondary);font-size:0.92rem}

.filters{display:flex;flex-wrap:wrap;gap:0.5rem;margin:1rem 0 1.5rem;position:sticky;top:64px;padding:1rem 0;background:var(--bg-color);z-index:5}
.chip{border:1px solid var(--border-color);background:var(--surface-color);color:var(--text-primary);font:inherit;font-size:0.88rem;font-weight:500;padding:0.5rem 1rem;border-radius:999px;cursor:pointer;transition:var(--transition)}
.chip span{color:var(--text-secondary);margin-left:0.35rem;font-weight:400}
.chip:hover{border-color:var(--accent-color)}
.chip[aria-pressed="true"]{background:var(--accent-color);border-color:var(--accent-color);color:#fff}
.chip[aria-pressed="true"] span{color:rgba(255,255,255,0.75)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;padding-bottom:6rem}
.card{text-align:left;font:inherit;color:inherit;background:var(--surface-color);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:1.75rem;box-shadow:var(--shadow-sm);cursor:pointer;transition:var(--transition);display:flex;flex-direction:column;gap:0.6rem;min-height:220px}
.card:hover,.card:focus-visible{box-shadow:var(--shadow-md);transform:translateY(-3px);outline:none}
.card .area{font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent-color)}
.card h3{font-size:1.15rem;font-weight:600;letter-spacing:-0.01em;line-height:1.3}
.card p{color:var(--text-secondary);font-size:0.95rem;line-height:1.55;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;margin-top:0.5rem}
.meta .co{font-size:0.8rem;font-weight:600;color:var(--text-primary);margin-right:0.35rem}
.tag{font-size:0.72rem;font-weight:500;padding:0.2rem 0.6rem;border-radius:999px;background:var(--accent-light);color:var(--accent-color)}
.more{font-size:0.85rem;font-weight:600;color:var(--accent-color)}

.scrim{position:fixed;inset:0;background:rgba(17,17,17,0.25);opacity:0;pointer-events:none;transition:opacity .3s;z-index:200}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface-color);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .45s cubic-bezier(0.16,1,0.3,1);z-index:201;overflow-y:auto;padding:2.5rem}
.open .scrim{opacity:1;pointer-events:auto}
.open .drawer{transform:none}
.close{position:absolute;top:1.25rem;right:1.25rem;width:40px;height:40px;border-radius:50%;border:1px solid var(--border-color);background:var(--surface-color);cursor:pointer;font-size:1.2rem;color:var(--text-secondary)}
.drawer .area{font-size:0.75rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent-color);margin-top:1rem}
.drawer h2{font-size:1.9rem;line-height:1.15;letter-spacing:-0.02em;margin:0.5rem 0 1rem}
.drawer .meta{margin:0 0 2rem}
.drawer h5{font-size:0.75rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary);margin:1.75rem 0 0.5rem}
.drawer p{font-size:1rem;line-height:1.7;color:var(--text-primary)}
.drawer .role{background:var(--bg-color);border-radius:16px;padding:1.25rem 1.5rem;margin-top:2rem}
.drawer .role p{color:var(--text-secondary)}
.note{font-size:0.82rem;color:var(--text-secondary);margin-top:-1rem;margin-bottom:2rem}

@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
  .container{padding:0 1rem}
  .intro{padding-top:7rem}
  h1{font-size:2.4rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip{white-space:nowrap}
  .drawer{padding:2rem 1.25rem}
}

/* HEADER */
header{position:fixed;top:0;width:100%;background:rgba(250,250,250,0.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border-color);z-index:1000;padding:1rem 0}
.nav-content{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:1.15rem;color:var(--accent-color);text-decoration:none;letter-spacing:-0.01em}
.nav-right{display:flex;align-items:center;gap:1.25rem}
.nav-links{display:flex;gap:2rem;align-items:center}
.nav-links a{text-decoration:none;color:var(--text-secondary);font-size:0.9rem;font-weight:500;transition:var(--transition)}
.nav-links a:hover{color:var(--text-primary)}
.lang-toggle-btn{background:rgba(0,0,0,0.05);border:none;padding:0.45rem 0.9rem;border-radius:30px;cursor:pointer;font-family:inherit;font-weight:600;font-size:0.8rem;color:var(--text-primary);transition:var(--transition);display:flex;align-items:center;gap:5px;white-space:nowrap}
.lang-toggle-btn:hover{background:rgba(0,0,0,0.1);transform:scale(1.05)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
.hamburger span{display:block;width:24px;height:2px;background:var(--text-primary);border-radius:2px;transition:var(--transition)}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* MOBILE NAV */
.mobile-nav{display:none;position:fixed;top:0;right:0;width:100%;height:100%;background:rgba(8,8,8,0.97);backdrop-filter:blur(20px);z-index:999;flex-direction:column;justify-content:center;align-items:center;gap:2.5rem;transform:translateX(100%);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1)}
.mobile-nav.open{transform:translateX(0)}
.mobile-nav a{text-decoration:none;color:#FFFFFF;font-size:1.75rem;font-weight:600;letter-spacing:-0.02em;opacity:0.85;transition:var(--transition)}
.mobile-nav a:hover{opacity:1}
@media(max-width:768px){
  .nav-links{display:none}
  .hamburger{display:flex}
  .mobile-nav{display:flex}
}

body.pt .lang-en{display:none!important}
body.en .lang-pt{display:none!important}
.scrim{z-index:1050!important}.drawer{z-index:1100!important}
.nav-links a.active{color:var(--text-primary)}
</style>
</head>
<body class="en">
<!-- Mobile Nav Overlay -->
<nav class="mobile-nav" id="mobileNav">
  <a href="/projects.html" class="lang-en mobile-nav-link">AI Portfolio</a>
  <a href="/projects.html" class="lang-pt mobile-nav-link">Portfólio de IA</a>
  <a href="/education.html" class="lang-en mobile-nav-link edu-link">Education</a>
  <a href="/education.html" class="lang-pt mobile-nav-link edu-link">Formação</a>
  <a href="/experience.html" class="lang-en mobile-nav-link">Experience</a>
  <a href="/experience.html" class="lang-pt mobile-nav-link">Trajetória</a>
  <a href="/#contact" class="lang-en mobile-nav-link">Contact</a>
  <a href="/#contact" class="lang-pt mobile-nav-link">Contato</a>
</nav>

<!-- Header -->
<header>
  <div class="container nav-content">
    <a href="/" class="logo">Will Del Valle</a>
    <div class="nav-right">
      <nav class="nav-links">
        <a href="/projects.html" class="lang-en active">AI Portfolio</a>
        <a href="/projects.html" class="lang-pt active">Portfólio de IA</a>
        <a href="/education.html" class="lang-en edu-link">Education</a>
        <a href="/education.html" class="lang-pt edu-link">Formação</a>
        <a href="/experience.html" class="lang-en">Experience</a>
        <a href="/experience.html" class="lang-pt">Trajetória</a>
        <a href="/#contact" class="lang-en">Contact</a>
        <a href="/#contact" class="lang-pt">Contato</a>
      </nav>
      <button id="langToggle" class="lang-toggle-btn" aria-label="Toggle language">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-color)"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <span id="langToggleText">PT</span>
      </button>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main class="container">
  <section class="intro">
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="h1"></h1>
    <p class="lead" data-i="lead"></p>
    <div class="stats">
      <div><h4>40+</h4><p data-i="s1"></p></div>
      <div><h4 id="s-scale"></h4><p data-i="s2"></p></div>
      <div><h4 id="s-pareto"></h4><p data-i="s3"></p></div>
      <div><h4 id="s-areas"></h4><p data-i="s4"></p></div>
    </div>
  </section>

  <div class="filters" id="filters" role="toolbar"></div>
  <div class="grid" id="grid"></div>
</main>

<div id="layer">
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <div id="d-body"></div>
  </aside>
</div>

<script src="/projects-data.js"></script>
<script>
const W=window, AREAS=W.PROJECT_AREAS, P=W.PROJECTS;
const UI={
 en:{back:'&larr; Back to portfolio',eyebrow:'AI Project Portfolio',h1:'The projects behind the numbers.',
  lead:'AI data and model-evaluation projects I managed and delivered at Scale AI and Pareto AI. Client and internal project names are omitted under NDA; each entry explains what the project was, how it worked and what it was for.',
  s1:'Projects &amp; workstreams',s2:'At Scale AI',s3:'At Pareto AI',s4:'Areas of work',all:'All',filter:'Filter by area',
  what:'What it was',how:'How it worked',why:'What it was for',plat:'Platforms',role:'My role',toggle:'PT',title:'AI Project Portfolio | Will Del Valle'},
 pt:{back:'&larr; Voltar ao portfólio',eyebrow:'Portfólio de projetos de IA',h1:'Cada projeto, explicado.',
  lead:'Projetos de dados e avaliação de modelos de IA que gerenciei e entreguei na Scale AI e na Pareto AI. Por contratos de confidencialidade (NDA), não cito nomes de clientes nem de projetos; cada item explica o que era o projeto, como funcionava e para que servia.',
  s1:'Projetos e frentes',s2:'Na Scale AI',s3:'Na Pareto AI',s4:'Áreas de atuação',all:'Todos',filter:'Filtrar por área',
  what:'O que era',how:'Como funcionava',why:'Para que servia',plat:'Plataformas',role:'Meu papel',toggle:'EN',title:'Portfólio de projetos de IA | Will Del Valle'}
};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let active='All', lang='en';
try{lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('lang')||'en';}catch(e){}
if(lang!=='pt')lang='en';

const area=a=>lang==='pt'?(W.PROJECT_AREAS_PT[a]||a):a;
const tag=t=>lang==='pt'?(W.PROJECT_TAGS_PT[t]||t):t;
const f=(p,k)=>lang==='pt'&&W.PROJECTS_PT[p.id]&&W.PROJECTS_PT[p.id][k]?W.PROJECTS_PT[p.id][k]:p[k];
const role=p=>f(p,'role')||(lang==='pt'?W.PROJECT_ROLES_PT:W.PROJECT_ROLES)[p.co];
const meta=p=>`<div class="meta"><span class="co">${p.co}</span>${p.tags.map(t=>`<span class="tag">${esc(tag(t))}</span>`).join('')}</div>`;

function renderStatic(){
  const u=UI[lang];
  document.documentElement.lang=lang==='pt'?'pt-BR':'en';
  document.title=u.title;
  document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=u[e.dataset.i]);
  document.body.classList.remove('en','pt');document.body.classList.add(lang);
  $('#langToggleText').textContent=u.toggle;
  document.querySelectorAll('.edu-link').forEach(a=>a.href='/education.html?lang='+lang);
  $('#filters').setAttribute('aria-label',u.filter);
}
function renderFilters(){
  const counts={All:P.length};AREAS.forEach(a=>counts[a]=P.filter(p=>p.area===a).length);
  $('#filters').innerHTML=['All',...AREAS].filter(a=>counts[a]).map(a=>
    `<button class="chip" aria-pressed="${a===active}" data-a="${a}">${esc(a==='All'?UI[lang].all:area(a))}<span>${counts[a]}</span></button>`).join('');
}
function renderGrid(){
  $('#grid').innerHTML=P.filter(p=>active==='All'||p.area===active).map(p=>`
    <button class="card" data-id="${p.id}">
      <span class="area">${esc(area(p.area))}</span>
      <h3>${esc(f(p,'title'))}</h3>
      <p>${esc(f(p,'line'))}</p>
      ${meta(p)}
    </button>`).join('');
}
let openId=null;
function openP(id,push=true){
  const p=P.find(x=>x.id===id);if(!p)return;openId=id;const u=UI[lang];
  $('#d-body').innerHTML=`
    <div class="area">${esc(area(p.area))}</div>
    <h2 id="d-title">${esc(f(p,'title'))}</h2>
    ${meta(p)}
    <h5>${u.what}</h5><p>${esc(f(p,'what'))}</p>
    <h5>${u.how}</h5><p>${esc(f(p,'how'))}</p>
    <h5>${u.why}</h5><p>${esc(f(p,'why'))}</p>
    ${p.platforms?`<h5>${u.plat}</h5><p>${esc(p.platforms)}</p>`:''}
    <div class="role"><h5 style="margin-top:0">${u.role}</h5><p>${esc(role(p))}</p></div>`;
  document.body.classList.add('open');document.body.style.overflow='hidden';
  if(push)history.replaceState(null,'','#'+id);
  $('#close').focus();
}
function closeP(){openId=null;document.body.classList.remove('open');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search);}
function renderAll(){renderStatic();renderFilters();renderGrid();if(openId)openP(openId,false);}
$('#langToggle').addEventListener('click',()=>{lang=lang==='pt'?'en':'pt';try{localStorage.setItem('lang',lang);}catch(e){}renderAll();});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;active=b.dataset.a;renderFilters();renderGrid();});
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openP(c.dataset.id);});
$('#scrim').addEventListener('click',closeP);$('#close').addEventListener('click',closeP);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeP();});
$('#s-scale').textContent=P.filter(p=>p.co==='Scale AI').length;
$('#s-pareto').textContent=P.filter(p=>p.co==='Pareto AI').length;
$('#s-areas').textContent=AREAS.length;
const hb=$('#hamburger'),mn=$('#mobileNav');
hb.addEventListener('click',()=>{hb.classList.toggle('open');mn.classList.toggle('open');document.body.style.overflow=mn.classList.contains('open')?'hidden':'';});
document.querySelectorAll('.mobile-nav-link').forEach(l=>l.addEventListener('click',()=>{hb.classList.remove('open');mn.classList.remove('open');document.body.style.overflow='';}));
renderAll();
if(location.hash)openP(location.hash.slice(1),false);
</script>
</body>
</html>
